name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 预装了 dotnet / Android SDK / ghc 等庞大工具链（10GB+）。
      # 真正的构建在 docker 内完成，删掉它们可为 NDK/SDK 编译腾出磁盘。
      - name: Free disk space
        run: |
          df -h || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/lib/jvm/temurin-21-jdk-amd64 \
            /opt/az 2>/dev/null || true
          docker system prune -a -f 2>/dev/null || true
          echo "--- after cleanup ---"
          df -h || true

      - name: Build APK (debug)
        id: build
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            kivy/buildozer:latest \
            android debug 2>&1 | tee "$GITHUB_WORKSPACE/buildozer.log"

      # 无论成败都上传构建日志，便于定位失败原因
      - name: Upload build log (diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inspection-helper-apk
          path: bin/*.apk
          if-no-files-found: error
