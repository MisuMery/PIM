name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 预装了 dotnet / Android SDK / ghc 等庞大工具链（10GB+）。
      # 真正的构建在 docker 内完成，删掉它们可为 NDK/SDK 编译腾出磁盘。
      - name: Free disk space
        run: |
          df -h || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/lib/jvm/temurin-21-jdk-amd64 \
            /opt/az 2>/dev/null || true
          docker system prune -a -f 2>/dev/null || true
          echo "--- after cleanup ---"
          df -h || true

      - name: Build APK (debug)
        id: build
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            kivy/buildozer:latest \
            android debug 2>&1 | tee "$GITHUB_WORKSPACE/buildozer.log"

      # 无论成败都上传构建日志，便于定位失败原因
      - name: Upload build log (diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn

      # 失败时把关键错误行写进 Job Summary，无需下载日志即可直接查看
      - name: Dump error summary
        if: failure()
        run: |
          {
            echo '## ❌ Buildozer 失败原因'
            echo
            echo '### 关键错误行（error / Traceback / Exception / failed）'
            echo '```'
            grep -nEi 'error:|errors:|traceback|exception|failed|fatal|No space left|Killed|gcc:|ld:' \
              buildozer.log 2>/dev/null | tail -n 60 || echo '(未匹配到关键字)'
            echo '```'
            echo
            echo '### 日志最后 150 行'
            echo '```'
            tail -n 150 buildozer.log 2>/dev/null || echo '(无日志)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 失败时把错误摘要推送到 ci-logs 分支（不触发 main 构建），
      # 便于通过 raw.githubusercontent.com 匿名读取定位问题
      - name: Publish error digest to ci-logs branch
        if: failure()
        run: |
          {
            echo "=== run #$GITHUB_RUN_NUMBER ==="
            echo "=== key errors ==="
            grep -nEi 'error|traceback|exception|failed|fatal|No space left|Killed|Command failed' \
              buildozer.log 2>/dev/null | tail -n 120 || echo '(no match)'
            echo
            echo "=== last 300 lines ==="
            tail -n 300 buildozer.log 2>/dev/null || echo '(no log)'
          } > error-digest.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f error-digest.txt
          git commit -m "ci: error digest for run $GITHUB_RUN_NUMBER" || exit 0
          git push -f origin ci-logs || echo "push failed"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inspection-helper-apk
          path: bin/*.apk
          if-no-files-found: error
